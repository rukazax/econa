restrictions:
- Do not relabel published generic modulus as measured shear modulus G.
- Before using reference modulus as FEM Young modulus explicitly record a model assumption
  about method, direction and constitutive model.
- Do not infer identical density, shear, bond or fatigue from compression class.
- Historical or analog-derived values remain assumptions when reporting strength,
  masses and draft.
- Use sensitivity checks; no statistical confidence interval claimed.
- Retain complete superstructure and roof load path.
